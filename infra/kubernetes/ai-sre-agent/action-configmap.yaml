apiVersion: v1
data:
  __init__.py: "from .ai_sre_agent import *\r\n"
  ai_sre_agent.py: "import os\r\nimport json\r\nimport subprocess\r\nimport logging\r\nimport
    re\r\nfrom datetime import datetime, timezone\r\nfrom robusta.api import (\r\n
    \   action,\r\n    Finding,\r\n    FindingSeverity,\r\n    FindingType,\r\n    MarkdownBlock,\r\n
    \   PodEvent,\r\n    JobEvent,\r\n    PrometheusKubernetesAlert,\r\n    KubernetesAnyChangeEvent,\r\n
    \   ExecutionBaseEvent\r\n)\r\n\r\ntry:\r\n    import requests as _req\r\nexcept
    ImportError:\r\n    _req = None\r\n\r\nlogger = logging.getLogger(__name__)\r\n\r\nGEMINI_API_KEY
    = os.environ.get(\"GEMINI_API_KEY\", \"\")\r\nGEMINI_MODEL = os.environ.get(\"GEMINI_MODEL\",
    \"gemini-3.8-flash\")\r\nGEMINI_URL = (\r\n    f\"https://generativelanguage.googleapis.com/v1beta/models/\"\r\n
    \   f\"{GEMINI_MODEL}:generateContent?key={GEMINI_API_KEY}\"\r\n)\r\n\r\n# ---------------------------------------------------------------------------\r\n#
    Tools Definition\r\n# ---------------------------------------------------------------------------\r\nTOOLS
    = [\r\n    {\r\n        \"functionDeclarations\": [\r\n            {\r\n                \"name\":
    \"kubectl_read\",\r\n                \"description\": \"Read cluster state (read-only).
    Allowed commands: kubectl get, describe, logs, events.\",\r\n                \"parameters\":
    {\r\n                    \"type\": \"OBJECT\",\r\n                    \"properties\":
    {\r\n                        \"command\": {\r\n                            \"type\":
    \"STRING\",\r\n                            \"description\": \"The kubectl command
    to run, e.g. 'kubectl get pod <name> -n <ns>'\"\r\n                        }\r\n
    \                   },\r\n                    \"required\": [\"command\"]\r\n
    \               }\r\n            },\r\n            {\r\n                \"name\":
    \"http_probe\",\r\n                \"description\": \"Perform an HTTP GET request
    to check endpoint health.\",\r\n                \"parameters\": {\r\n                    \"type\":
    \"OBJECT\",\r\n                    \"properties\": {\r\n                        \"url\":
    {\r\n                            \"type\": \"STRING\"\r\n                        }\r\n
    \                   },\r\n                    \"required\": [\"url\"]\r\n                }\r\n
    \           },\r\n            {\r\n                \"name\": \"tcp_probe\",\r\n
    \               \"description\": \"Test TCP connectivity to a host and port from
    within the cluster.\",\r\n                \"parameters\": {\r\n                    \"type\":
    \"OBJECT\",\r\n                    \"properties\": {\r\n                        \"host\":
    {\r\n                            \"type\": \"STRING\"\r\n                        },\r\n
    \                       \"port\": {\r\n                            \"type\": \"INTEGER\"\r\n
    \                       },\r\n                        \"namespace\": {\r\n                            \"type\":
    \"STRING\"\r\n                        }\r\n                    },\r\n                    \"required\":
    [\"host\", \"port\", \"namespace\"]\r\n                }\r\n            },\r\n
    \           {\r\n                \"name\": \"get_rollout_history\",\r\n                \"description\":
    \"Get the rollout history of a deployment.\",\r\n                \"parameters\":
    {\r\n                    \"type\": \"OBJECT\",\r\n                    \"properties\":
    {\r\n                        \"deployment\": {\r\n                            \"type\":
    \"STRING\"\r\n                        },\r\n                        \"namespace\":
    {\r\n                            \"type\": \"STRING\"\r\n                        }\r\n
    \                   },\r\n                    \"required\": [\"deployment\", \"namespace\"]\r\n
    \               }\r\n            }\r\n        ]\r\n    }\r\n]\r\n\r\ndef _run(cmd:
    str, timeout: int = 30) -> str:\r\n    try:\r\n        result = subprocess.run(cmd,
    shell=True, capture_output=True, text=True, timeout=timeout)\r\n        return
    (result.stdout + result.stderr).strip()\r\n    except subprocess.TimeoutExpired:\r\n
    \       return f\"[timeout after {timeout}s]: {cmd}\"\r\n    except Exception
    as e:\r\n        return f\"[error: {e}]\"\r\n\r\ndef execute_tool(name: str, args:
    dict) -> str:\r\n    if name == \"kubectl_read\":\r\n        cmd = args.get(\"command\",
    \"\")\r\n        if not cmd.startswith(\"kubectl \") or not any(v in cmd for v
    in [\" get \", \" describe \", \" logs \", \" events \"]):\r\n            return
    \"Error: only kubectl get/describe/logs/events are allowed.\"\r\n        if any(bad
    in cmd for bad in [\";\", \"|\", \"&\", \">\", \"<\"]):\r\n            return
    \"Error: shell operators are not allowed.\"\r\n        return _run(cmd)\r\n    elif
    name == \"http_probe\":\r\n        url = args.get(\"url\")\r\n        return _run(f\"curl
    -sSL -D - --max-time 10 {url}\")\r\n    elif name == \"tcp_probe\":\r\n        host
    = args.get(\"host\")\r\n        port = args.get(\"port\")\r\n        ns = args.get(\"namespace\",
    \"default\")\r\n        return _run(f\"kubectl run tmp-tcp-probe-{int(datetime.now().timestamp())}
    --image=busybox --restart=Never --rm -i -n {ns} -- nc -zv {host} {port}\")\r\n
    \   elif name == \"get_rollout_history\":\r\n        dep = args.get(\"deployment\")\r\n
    \       ns = args.get(\"namespace\", \"default\")\r\n        return _run(f\"kubectl
    rollout history deployment/{dep} -n {ns}\")\r\n    return f\"Unknown tool: {name}\"\r\n\r\n#
    ---------------------------------------------------------------------------\r\n#
    Policy Engine\r\n# ---------------------------------------------------------------------------\r\ndef
    _is_safe_command(cmd: str, is_django_ns: bool) -> tuple:\r\n    cmd = cmd.strip()\r\n
    \   if not cmd.startswith(\"kubectl \"):\r\n        return False, \"Not a kubectl
    command\"\r\n    \r\n    # Must be in django namespace for write operations\r\n
    \   if not is_django_ns:\r\n        return False, \"Write operations only allowed
    in 'django' namespace.\"\r\n\r\n    safe_prefixes = [\"kubectl rollout restart\",
    \"kubectl rollout undo\", \"kubectl scale\"]\r\n    patch_prefixes = [\"kubectl
    set image\", \"kubectl set env\", \"kubectl set resources\", \"kubectl patch\"]\r\n\r\n
    \   for sp in safe_prefixes:\r\n        if cmd.startswith(sp):\r\n            return
    True, \"\"\r\n            \r\n    for pp in patch_prefixes:\r\n        if cmd.startswith(pp):\r\n
    \           if \"deployment\" not in cmd and \"deploy/\" not in cmd:\r\n                return
    False, \"Patch operations only allowed on deployments.\"\r\n            return
    True, \"\"\r\n            \r\n    return False, \"Command verb not in allowlist.\"\r\n\r\n#
    ---------------------------------------------------------------------------\r\n#
    Investigation Loop\r\n# ---------------------------------------------------------------------------\r\ndef
    _investigate(initial_prompt: str, is_django_ns: bool) -> dict:\r\n    if not _req
    or not GEMINI_API_KEY:\r\n        return {\"error\": \"Missing requests module
    or GEMINI_API_KEY\"}\r\n\r\n    messages = [{\"role\": \"user\", \"parts\": [{\"text\":
    initial_prompt}]}]\r\n    \r\n    for step in range(12):\r\n        payload =
    {\r\n            \"contents\": messages,\r\n            \"tools\": TOOLS,\r\n
    \           \"systemInstruction\": {\r\n                \"parts\": [{\"text\":
    \"You are an elite Kubernetes SRE. Investigate the failure step by step using
    tools. \"\r\n                                   \"Once you identify the root cause,
    return a JSON response with the fix. \"\r\n                                   \"Ensure
    the JSON matches exactly: { \\\"root_cause\\\": \\\"...\\\", \\\"evidence\\\":
    [\\\"...\\\"], \\\"fix_commands\\\": [\\\"...\\\"], \\\"risk\\\": \\\"high/low\\\",
    \\\"verification\\\": \\\"...\\\", \\\"rollback\\\": \\\"...\\\" }.\\n\"\r\n                                   \"Do
    not include any Markdown block backticks, just output raw JSON.\"}]\r\n            },\r\n
    \           \"generationConfig\": {\r\n                \"temperature\": 0.05,\r\n
    \           }\r\n        }\r\n        \r\n        try:\r\n            for attempt
    in range(3):\r\n                try:\r\n                    resp = _req.post(GEMINI_URL,
    json=payload, timeout=60)\r\n                    resp.raise_for_status()\r\n                    break\r\n
    \               except Exception as e:\r\n                    if attempt == 2:
    raise\r\n                    import time; time.sleep(2)\r\n            data =
    resp.json()\r\n            part = data[\"candidates\"][0][\"content\"][\"parts\"][0]\r\n
    \           \r\n            # Add model response to history\r\n            messages.append({\"role\":
    \"model\", \"parts\": [part]})\r\n            \r\n            if \"functionCall\"
    in part:\r\n                call = part[\"functionCall\"]\r\n                name
    = call[\"name\"]\r\n                args = call.get(\"args\", {})\r\n                logger.info(f\"AI-SRE
    Tool call: {name}({args})\")\r\n                \r\n                result = execute_tool(name,
    args)\r\n                if len(result) > 5000:\r\n                    result
    = result[:2500] + \"\\n...[TRUNCATED]...\\n\" + result[-2500:]\r\n                    \r\n
    \               messages.append({\r\n                    \"role\": \"user\", #
    The API for some reason requires the function response as user or tool role, let's
    use user role with functionResponse or just append text. Wait, standard is role:
    user for functionResponse in REST if we aren't strict, but let's use the correct
    REST structure.\r\n                    \"parts\": [{\"text\": f\"Function {name}
    returned:\\n{result}\"}]\r\n                })\r\n            else:\r\n                text
    = part.get(\"text\", \"\")\r\n                m = re.search(r'\\{.*\\}', text,
    re.DOTALL)\r\n                if m:\r\n                    try:\r\n                        parsed
    = json.loads(m.group(0))\r\n                        parsed[\"steps\"] = step +
    1\r\n                        return parsed\r\n                    except json.JSONDecodeError:\r\n
    \                       return {\"error\": \"Invalid JSON response\", \"raw\":
    text}\r\n                else:\r\n                    return {\"error\": \"No
    JSON found\", \"raw\": text}\r\n                    \r\n        except Exception
    as e:\r\n            logger.error(f\"AI-SRE loop error: {e}\")\r\n            return
    {\"error\": str(e)}\r\n            \r\n    return {\"error\": \"Max steps reached\"}\r\n\r\n#
    ---------------------------------------------------------------------------\r\n#
    Orchestrator\r\n# ---------------------------------------------------------------------------\r\ndef
    _run_healing_loop(context: str, namespace: str, resource: str):\r\n    logger.info(f\"AI-SRE
    starting investigation for {namespace}/{resource}\")\r\n    is_django = namespace
    == \"django\"\r\n    \r\n    prompt = f\"Failure detected in namespace '{namespace}'
    on resource '{resource}'. Context: {context}\\nInvestigate this issue using the
    provided tools.\"\r\n    \r\n    result = _investigate(prompt, is_django)\r\n
    \   if \"error\" in result:\r\n        logger.error(f\"AI-SRE investigation failed:
    {result['error']}\")\r\n        return result, []\r\n        \r\n    fix_results
    = []\r\n    commands = result.get(\"fix_commands\", [])\r\n    if not commands:\r\n
    \       fix_results.append(\"No fix commands suggested.\")\r\n        return result,
    fix_results\r\n        \r\n    for cmd in commands:\r\n        safe, reason =
    _is_safe_command(cmd, is_django)\r\n        if not safe:\r\n            fix_results.append(f\"Blocked:
    {cmd} - {reason}\")\r\n            continue\r\n            \r\n        # Dry run\r\n
    \       dry_run_cmd = f\"{cmd} --dry-run=server\"\r\n        dry_out = _run(dry_run_cmd)\r\n
    \       if \"error\" in dry_out.lower() or \"forbidden\" in dry_out.lower():\r\n
    \           fix_results.append(f\"Dry run failed for {cmd}:\\n{dry_out}\")\r\n
    \           continue\r\n            \r\n        # Execute\r\n        logger.info(f\"AI-SRE
    Executing fix: {cmd}\")\r\n        out = _run(cmd)\r\n        fix_results.append(f\"Executed:
    {cmd}\\nOutput: {out}\")\r\n        \r\n    return result, fix_results\r\n\r\ndef
    _build_finding(title: str, ai_result: dict, exec_results: list) -> Finding:\r\n
    \   sev = FindingSeverity.HIGH\r\n    finding = Finding(\r\n        title=title,\r\n
    \       source=FindingType.ISSUE,\r\n        aggregation_key=title,\r\n        severity=sev,\r\n
    \   )\r\n    \r\n    if \"error\" in ai_result:\r\n        finding.add_enrichment([MarkdownBlock(f\"**AI
    Error:** {ai_result['error']}\\n\\n**Raw:**\\n{ai_result.get('raw', '')}\")])\r\n
    \       return finding\r\n        \r\n    exec_text = \"\\n\".join(exec_results)
    if exec_results else \"(no commands executed)\"\r\n    \r\n    finding.add_enrichment([\r\n
    \       MarkdownBlock(\r\n            f\"## \U0001F50D Root Cause\\n\"\r\n            f\"{ai_result.get('root_cause',
    'N/A')}\\n\\n\"\r\n            f\"## \U0001F4CA Evidence\\n\"\r\n            f\"{chr(10).join(['-
    ' + e for e in ai_result.get('evidence', [])])}\\n\\n\"\r\n            f\"## ΓÜá∩╕Å
    Risk: {ai_result.get('risk', 'unknown')}\\n\\n\"\r\n            f\"## \U0001F6E0
    Execution Results\\n\"\r\n            f\"```\\n{exec_text}\\n```\\n\\n\"\r\n            f\"##
    \U0001F52C Verification\\n\"\r\n            f\"{ai_result.get('verification',
    'N/A')}\\n\\n\"\r\n            f\"## ΓÅ¬ Rollback\\n\"\r\n            f\"{ai_result.get('rollback',
    'N/A')}\"\r\n        )\r\n    ])\r\n    return finding\r\n\r\n# ---------------------------------------------------------------------------\r\n#
    Robusta Action Handlers\r\n# ---------------------------------------------------------------------------\r\n@action\r\ndef
    ai_sre_pod_failure(event: PodEvent):\r\n    pod = event.get_pod()\r\n    if not
    pod: return\r\n    ns, name = pod.metadata.namespace, pod.metadata.name\r\n    context
    = f\"Pod Crash/Failure: {ns}/{name}\"\r\n    res, execs = _run_healing_loop(context,
    ns, name)\r\n    event.add_finding(_build_finding(f\"AI-SRE Pod Fix: {ns}/{name}\",
    res, execs))\r\n\r\n@action\r\ndef ai_sre_job_failure(event: JobEvent):\r\n    job
    = event.get_job()\r\n    if not job: return\r\n    ns, name = job.metadata.namespace,
    job.metadata.name\r\n    context = f\"Job Failure: {ns}/{name}\"\r\n    res, execs
    = _run_healing_loop(context, ns, name)\r\n    event.add_finding(_build_finding(f\"AI-SRE
    Job Fix: {ns}/{name}\", res, execs))\r\n\r\n@action\r\ndef ai_sre_prometheus_alert(event:
    PrometheusKubernetesAlert):\r\n    alert = getattr(event, 'alert', None)\r\n    if
    not alert: return\r\n    labels = alert.labels\r\n    ns = labels.get(\"namespace\",
    \"default\")\r\n    name = labels.get(\"pod\") or labels.get(\"deployment\") or
    \"unknown\"\r\n    context = f\"Prometheus Alert: {alert.name} for {ns}/{name}.
    Labels: {labels}\"\r\n    res, execs = _run_healing_loop(context, ns, name)\r\n
    \   event.add_finding(_build_finding(f\"AI-SRE Alert: {alert.name}\", res, execs))"
  pyproject.toml: "[tool.poetry]\r\nname = \"ai_sre_actions\"\r\nversion = \"0.1.0\"\r\ndescription
    = \"AI SRE Gemini-powered auto-healing actions\"\r\nauthors = [\"SRE <sre@company.com>\"]\r\n\r\n[tool.poetry.dependencies]\r\npython
    = \"^3.9\"\r\nrequests = \"*\"\r\n\r\n[build-system]\r\nrequires = [\"poetry-core>=1.0.0\"]\r\nbuild-backend
    = \"poetry.core.masonry.api\"\r\n"
