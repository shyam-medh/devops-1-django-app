controller:
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
  serviceType: ClusterIP
  # Required for AWS EKS Fargate — without this annotation the pod
  # is never picked up by the Fargate scheduler and stays Pending forever.
  podAnnotations:
    eks.amazonaws.com/compute-type: fargate
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
persistence:
  enabled: true
  existingClaim: efs-claim

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::197136686449:role/jenkins-serverless-agent"

serviceAccountAgent:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::197136686449:role/jenkins-serverless-agent"
