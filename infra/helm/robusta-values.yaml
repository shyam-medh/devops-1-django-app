clusterName: django-notes-eks-prod
isSmallCluster: true

# webhook_sink: findings are POSTed as JSON — also logged to stdout → CloudWatch via Fluent Bit
sinksConfig:
  - webhook_sink:
      name: ai_sre_cloudwatch_sink
      url: "https://httpbin.org/post"
      format: json

runner:
  additional_env_vars:
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          name: gemini-api-key
          key: api_key
  extraVolumes:
    - name: ai-sre-action
      configMap:
        name: ai-sre-action
  extraVolumeMounts:
    # pyproject.toml at the repo root so Robusta can read tool.poetry.name
    - name: ai-sre-action
      mountPath: /etc/robusta/playbooks/storage/ai_sre_actions/pyproject.toml
      subPath: pyproject.toml
    # Package module files inside the ai_sre_actions/ subdirectory
    - name: ai-sre-action
      mountPath: /etc/robusta/playbooks/storage/ai_sre_actions/ai_sre_actions/__init__.py
      subPath: __init__.py
    - name: ai-sre-action
      mountPath: /etc/robusta/playbooks/storage/ai_sre_actions/ai_sre_actions/ai_sre_agent.py
      subPath: ai_sre_agent.py

customPlaybooks:
  # Pod failures: CrashLoopBackOff, ImagePullBackOff, general crashes
  - triggers:
      - on_pod_crash_loop: {}
      - on_image_pull_backoff: {}
    actions:
      - ai_sre_pod_failure: {}

  # OOMKilled is a separate trigger from crash_loop in Robusta
  - triggers:
      - on_pod_oom_killed: {}
    actions:
      - ai_sre_pod_failure: {}

  # Job failures
  - triggers:
      - on_job_failure: {}
    actions:
      - ai_sre_job_failure: {}

  # ALL Prometheus alerts — catch-all for node pressure, PVC, network, high error rate, etc.
  - triggers:
      - on_prometheus_alert: {}
    actions:
      - ai_sre_prometheus_alert: {}
