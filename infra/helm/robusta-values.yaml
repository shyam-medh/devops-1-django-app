clusterName: django-notes-eks-prod
isSmallCluster: true



# webhook_sink: findings are POSTed as JSON — also logged to stdout → CloudWatch via Fluent Bit
sinksConfig:
  - webhook_sink:
      name: ai_sre_cloudwatch_sink
      url: "https://httpbin.org/post"
      format: json

# playbookRepos removed in favor of direct ConfigMap mount

runner:
  extraEnv:
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          name: gemini-api-key
          key: api_key
  extraVolumes:
    - name: ai-sre-action
      configMap:
        name: ai-sre-action
  extraVolumeMounts:
    - name: ai-sre-action
      mountPath: /etc/robusta/playbooks/storage/ai_sre_actions

customPlaybooks:
  # Pod failures: CrashLoopBackOff, ImagePullBackOff, general crashes
  - triggers:
      - on_pod_crash_loop: {}
    actions:
      - ai_sre_pod_failure: {}

  # OOMKilled is a separate trigger from crash_loop in Robusta
  - triggers:
      - on_pod_oom_killed: {}
    actions:
      - ai_sre_pod_failure: {}

  # Job failures
  - triggers:
      - on_job_failure: {}
    actions:
      - ai_sre_job_failure: {}

  # ALL Prometheus alerts — catch-all for node pressure, PVC, network, high error rate, etc.
  - triggers:
      - on_prometheus_alert: {}
    actions:
      - ai_sre_prometheus_alert: {}
