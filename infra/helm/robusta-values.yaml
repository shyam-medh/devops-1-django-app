clusterName: django-notes-eks-prod
isSmallCluster: true



# webhook_sink: findings are POSTed as JSON — also logged to stdout → CloudWatch via Fluent Bit
sinksConfig:
  - webhook_sink:
      name: ai_sre_cloudwatch_sink
      url: "https://httpbin.org/post"
      format: json

playbookRepos:
  ai_sre_actions:
    # Robusta pulls the action files from this Git URL.
    # It looks for Python files in the repo root OR in the path specified.
    # Our ai_sre_agent.py lives at: infra/kubernetes/ai-sre-agent/ai_sre_agent.py
    # Robusta needs the directory — use the subfolder URL format.
    url: "https://github.com/shyam-medh/devops-1-django-app.git"
    branch: main
    # Tell Robusta where inside the repo to find the Python action files
    pip_install: false
    # The path inside the repo that contains the action .py files
    # Robusta will import all .py files from this directory
    github_url: "https://raw.githubusercontent.com/shyam-medh/devops-1-django-app/main/infra/kubernetes/ai-sre-agent/"

# Inject Gemini API key securely from Kubernetes Secret
runner:
  extraEnv:
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          name: gemini-api-key
          key: api_key

customPlaybooks:
  # Pod failures: CrashLoopBackOff, ImagePullBackOff, general crashes
  - triggers:
      - on_pod_crash_loop: {}
    actions:
      - ai_sre_pod_failure: {}

  # OOMKilled is a separate trigger from crash_loop in Robusta
  - triggers:
      - on_pod_oom_killed: {}
    actions:
      - ai_sre_pod_failure: {}

  # Job failures
  - triggers:
      - on_job_failure: {}
    actions:
      - ai_sre_job_failure: {}

  # ALL Prometheus alerts — catch-all for node pressure, PVC, network, high error rate, etc.
  - triggers:
      - on_prometheus_alert: {}
    actions:
      - ai_sre_prometheus_alert: {}
